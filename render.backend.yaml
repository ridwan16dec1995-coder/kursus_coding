services:
  - type: web
    name: kursus-app-api
    runtime: docker
    region: singapore
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTO_CREATE_SCHEMA
        value: false
      - key: SESSION_COOKIE_SECURE
        value: true
      - key: RATE_LIMIT_ENABLED
        value: true
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false
